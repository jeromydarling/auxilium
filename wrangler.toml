# ─────────────────────────────────────────────────────────────────────────────
# Auxilium — Cloudflare Worker configuration
#
# One Worker serves both halves of the product:
#   • /api/*  → Hono router (workers/index.ts)
#   • /*      → the built React SPA from dist/client via the [assets] binding
#
# THE IDS BELOW ARE REAL and already provisioned in the Cloudflare account.
# If you are forking this into a different account, run `bun run cf:setup`
# (scripts/cloudflare-setup.sh) and replace every id/database_id below with the
# values it prints. See docs/cloudflare-setup.md for the full walkthrough.
#
# Environment strategy:
#   • top level      → local development (`wrangler dev`) and the dev resources
#   • [env.preview]  → deployed staging, shares the *dev* data plane
#   • [env.production] → real ministry data, its own D1/R2/KV
# ─────────────────────────────────────────────────────────────────────────────

# The top level is the LOCAL/dev configuration — `wrangler dev`, and any bare
# `wrangler deploy` that does not pass --env.
#
# It is deliberately NOT named "auxilium-app". Production is `auxilium-app`
# under [env.production], and while the two shared a name a bare `wrangler
# deploy` from anywhere silently republished production bound to the *dev*
# D1, R2, and KV. That is exactly what Cloudflare Workers Builds was doing on
# every push. Different name, and that class of accident stops being possible.
name = "auxilium-dev"
main = "workers/index.ts"
compatibility_date = "2025-02-14"
compatibility_flags = ["nodejs_compat"]

# Build the SPA before any deploy, so `wrangler deploy` is self-sufficient.
#
# The package.json scripts chain `bun run build && wrangler deploy`, which is
# fine when the deploy starts here — but deploys now also originate from
# Cloudflare Workers Builds, which runs its own command against this repo. A
# bare `wrangler deploy` with no prior build ships a Worker whose [assets]
# directory is missing or stale: the marketing pages still render, because the
# Worker generates those, but every /app/* route and every JS/CSS bundle 404s.
#
# Putting it here means the build cannot be forgotten by whoever invokes the
# deploy. It also runs before `wrangler dev`, which needs dist/client for the
# same reason.
[build]
command = "bun run build"

# ── Cron ─────────────────────────────────────────────────────────────────────
# The monthly billing close: calculate and invoice the platform fee for the
# month that just ended.
#
# 06:00 UTC on the 1st rather than midnight, deliberately. Card settlement is
# not instantaneous, and closing a month the second it ends invoices before the
# last of its money has landed. The close is idempotent and refuses to close a
# period that has not ended, so a retried or double-fired trigger cannot
# double-bill.
[triggers]
# Two schedules, one handler. Cloudflare does not tell a Worker which cron
# fired, so `scheduled` reconciles on every firing and closes the month only
# when the date is the 1st — the close is idempotent and refuses a period that
# has not ended, so reading the date wrong is a no-op rather than a double-bill.
#
# 05:00 daily: repair any gap between Stripe and the ledger. A webhook Stripe
# never delivered heals within a day and nobody is told, which is the point.
#
# 06:00 on the 1st: the month's close. Note that on the 1st *both* schedules
# fire and both take the close path — the handler always reconciles before it
# closes, so the ordering that matters (repair the month before invoicing a
# percentage of it) holds within a single firing rather than between the two.
# The second firing is an idempotent retry: `closePeriod` returns a period past
# 'open' untouched and Stripe's idempotency keys are derived from org and
# period, so it cannot double-bill — and if the 05:00 close failed for a
# transient reason, 06:00 quietly fixes it.
crons = ["0 5 * * *", "0 6 1 * *"]

# Smart Placement moves the Worker close to D1 rather than to the eyeball.
# Auxilium is read-heavy against D1 on nearly every route, so this is the right
# default. Remove it if you later add latency-sensitive edge-only paths.
[placement]
mode = "smart"

# The SPA, mounted under /app. `not_found_handling = "single-page-application"`
# makes client-side routes like /app/members/mem_xxx resolve to index.html
# instead of 404ing.
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The Worker runs before static assets so it can own the site root: "/" must
# reach the marketing renderer rather than being answered with the SPA's
# index.html. Anything the Worker does not recognise falls through to
# ASSETS.fetch, which is how /app/* and the JS/CSS bundles are served.
run_worker_first = true

[observability]
enabled = true

# Non-secret config only. Secrets go through `wrangler secret put` — never here.
[vars]
APP_ENV = "development"
# The platform's own hostname. Any other Host arriving here is a candidate
# ministry custom domain — see the check at the top of workers/index.ts. Set
# rather than inferred, so the platform's own site can never be claimed as a
# ministry domain and so an unrecognised host costs one indexed lookup rather
# than a guess.
APP_HOST = "localhost:8787"
APP_NAME = "Auxilium"
# Signals older than this are recomputed on read. Keeps the compass honest
# without hammering D1 on every page load.
NRI_SIGNAL_TTL_SECONDS = "900"
# Hard ceiling on rows accepted from a single CSV upload.
IMPORT_MAX_ROWS = "10000"

# ── D1 (system of record) ────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "auxilium-db-dev"
database_id = "74302f2c-3196-478c-9695-f971cb86b5f1"
migrations_dir = "schema/migrations"

# ── R2 (documents, import source files, member files) ────────────────────────
# Key prefixes are enforced in workers/lib/storage.ts:
#   imports/<org>/<import_id>/source.csv
#   documents/<org>/<yyyy>/<mm>/<doc_id>-<slug>
#   member-files/<org>/<member_id>/<doc_id>-<slug>
[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "auxilium-documents-dev"

# ── KV (fast mutable config + cache ONLY — never the system of record) ───────
[[kv_namespaces]]
binding = "CACHE"
id = "0496371cc04f4a6d88a5a775adc43a4d"

[[kv_namespaces]]
binding = "CONFIG"
id = "428a86cb58f8456aba0eaf01ce7b7605"

# ── Email (operational alerts) ───────────────────────────────────────────────
# Cloudflare Email Sending, not a third-party mail API: no key, no SDK, no
# vendor that can be down separately from the Worker.
#
# The binding alone sends nothing. `ALERT_FROM_EMAIL` is a secret rather than a
# var here — not because a From address is sensitive, but because setting it is
# the switch that turns delivery on, and it should be turned on per environment
# by somebody who means to. Preview deliberately does not have it: preview
# shares the *dev* database, whose demo ministries have fabricated staff
# addresses, and a preview deploy that can mail them is a preview deploy that
# will.
#
# Deliberately no `destination_address` / `allowed_destination_addresses`
# restriction: ministry alerts go to whichever owner or admin a ministry
# registered, so an allowlist in this file could only ever be wrong.
#
# `remote = true` is not set, so `wrangler dev` simulates the binding and writes
# the message to a temp file instead of mailing anybody. That is what you want
# locally — see workers/lib/email.ts, which logs the whole message when there is
# no From address at all.
[[send_email]]
name = "EMAIL"

# ── Queues ───────────────────────────────────────────────────────────────────
# Queues cannot be created through the API token used by `wrangler d1/kv/r2
# create` flows in every account tier — if `wrangler queues create` fails, make
# them in the dashboard (Workers & Pages → Queues) with these exact names.
#
# auxilium-imports  → row normalization + commit for uploaded rosters
# auxilium-signals  → NRI signal recomputation after data changes
[[queues.producers]]
binding = "IMPORT_QUEUE"
queue = "auxilium-imports"

[[queues.producers]]
binding = "SIGNAL_QUEUE"
queue = "auxilium-signals"

[[queues.consumers]]
queue = "auxilium-imports"
max_batch_size = 25
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "auxilium-imports-dlq"

[[queues.consumers]]
queue = "auxilium-signals"
max_batch_size = 50
max_batch_timeout = 15
max_retries = 3
dead_letter_queue = "auxilium-signals-dlq"

# ─────────────────────────────────────────────────────────────────────────────
# PREVIEW — deployed staging. Deliberately points at the *dev* data plane so
# preview deploys can never touch real ministry records.
# Deploy with: bun run deploy:preview
# ─────────────────────────────────────────────────────────────────────────────
[env.preview]
name = "auxilium-app-preview"

[env.preview.placement]
mode = "smart"

[env.preview.assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The Worker runs before static assets so it can own the site root: "/" must
# reach the marketing renderer rather than being answered with the SPA's
# index.html. Anything the Worker does not recognise falls through to
# ASSETS.fetch, which is how /app/* and the JS/CSS bundles are served.
run_worker_first = true

[env.preview.observability]
enabled = true

[env.preview.triggers]
crons = ["0 5 * * *", "0 6 1 * *"]

[env.preview.vars]
APP_ENV = "preview"
APP_HOST = "auxilium-app-preview.jer-f84.workers.dev"
APP_NAME = "Auxilium (Preview)"
NRI_SIGNAL_TTL_SECONDS = "900"
IMPORT_MAX_ROWS = "10000"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "auxilium-db-dev"
database_id = "74302f2c-3196-478c-9695-f971cb86b5f1"
migrations_dir = "schema/migrations"

[[env.preview.r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "auxilium-documents-dev"

[[env.preview.kv_namespaces]]
binding = "CACHE"
id = "0496371cc04f4a6d88a5a775adc43a4d"

[[env.preview.kv_namespaces]]
binding = "CONFIG"
id = "428a86cb58f8456aba0eaf01ce7b7605"

# Bound so the code path is identical to production, and left unable to send:
# no ALERT_FROM_EMAIL secret in preview means `emailConfigured` is false, alerts
# are recorded and logged, and the demo ministries' fabricated staff addresses
# are never mailed.
[[env.preview.send_email]]
name = "EMAIL"

[[env.preview.queues.producers]]
binding = "IMPORT_QUEUE"
queue = "auxilium-imports"

[[env.preview.queues.producers]]
binding = "SIGNAL_QUEUE"
queue = "auxilium-signals"

[[env.preview.queues.consumers]]
queue = "auxilium-imports"
max_batch_size = 25
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "auxilium-imports-dlq"

[[env.preview.queues.consumers]]
queue = "auxilium-signals"
max_batch_size = 50
max_batch_timeout = 15
max_retries = 3
dead_letter_queue = "auxilium-signals-dlq"

# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTION — real ministry data. Separate D1, R2, and KV from everything else.
# Deploy with: bun run deploy:production
# ─────────────────────────────────────────────────────────────────────────────
[env.production]
name = "auxilium-app"

[env.production.placement]
mode = "smart"

[env.production.assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The Worker runs before static assets so it can own the site root: "/" must
# reach the marketing renderer rather than being answered with the SPA's
# index.html. Anything the Worker does not recognise falls through to
# ASSETS.fetch, which is how /app/* and the JS/CSS bundles are served.
run_worker_first = true

[env.production.observability]
enabled = true

[env.production.triggers]
crons = ["0 5 * * *", "0 6 1 * *"]

[env.production.vars]
APP_ENV = "production"
# The platform's own hostname, and now the real one.
#
# This trailed the domain for a while: auxiliumos.com was serving the site
# while this still said auxilium-app.jer-f84.workers.dev, and two things read
# it and were quietly wrong. Ministry alert emails linked to the workers.dev
# address, and every ministry setting up a custom domain was told to point its
# CNAME there — so a ministry's public site would have depended on a hostname
# that is an implementation detail rather than the product.
#
# The workers.dev address keeps working: a request arriving on it no longer
# matches this, so it takes the unrecognised-host path, misses, and is served
# as the platform exactly as before.
APP_HOST = "auxiliumos.com"
APP_NAME = "Auxilium"
NRI_SIGNAL_TTL_SECONDS = "900"
IMPORT_MAX_ROWS = "10000"

[[env.production.d1_databases]]
binding = "DB"
database_name = "auxilium-db-prod"
database_id = "ea56fb83-a754-45a3-b2a9-ae54914e43b3"
migrations_dir = "schema/migrations"

[[env.production.r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "auxilium-documents-prod"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "97b32f34cc414900b0243b5c4ffd1415"

[[env.production.kv_namespaces]]
binding = "CONFIG"
id = "fbccaa55ec0546db851a26822e5cf637"

[[env.production.send_email]]
name = "EMAIL"

# Production gets its OWN queues, like it gets its own D1, R2, and KV.
#
# Queues were the one resource shared across every environment, and that was a
# real hazard rather than an untidiness. A Cloudflare queue has exactly one
# consumer. With a single shared set, whichever Worker deployed last owned the
# consumer slot while every other Worker stayed a producer — so a production
# roster import could be picked up by a Worker bound to the *dev* database and
# committed there. The import would appear to hang forever, and the rows would
# land in the wrong place with no error anywhere.
#
# Splitting them makes that impossible: production produces and consumes only
# its own queues.
[[env.production.queues.producers]]
binding = "IMPORT_QUEUE"
queue = "auxilium-imports-prod"

[[env.production.queues.producers]]
binding = "SIGNAL_QUEUE"
queue = "auxilium-signals-prod"

[[env.production.queues.consumers]]
queue = "auxilium-imports-prod"
max_batch_size = 25
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "auxilium-imports-prod-dlq"

[[env.production.queues.consumers]]
queue = "auxilium-signals-prod"
max_batch_size = 50
max_batch_timeout = 15
max_retries = 3
dead_letter_queue = "auxilium-signals-prod-dlq"
