name: Deploy

# Trunk-based: a push to main deploys production. Preview deploys are manual,
# from the Actions tab, so a staging URL is never a surprise.
#
# Requires one repository secret: CLOUDFLARE_API_TOKEN, with edit permissions
# for Workers Scripts, D1, R2, KV, and Queues.
# Add it at: Settings → Secrets and variables → Actions → New repository secret

on:
  push:
    branches: [main]
    # Documentation changes do not need a deploy.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        type: choice
        options: [production, preview]
        default: production
      seed_demo:
        description: Seed demo data into the target environment
        type: boolean
        default: false
      # Typed, not a checkbox, and only ever reachable from a manual run.
      #
      # The point of the old blanket refusal was that demo data must never
      # appear in production by accident — not that it must never appear. A
      # push cannot set this, `workflow_dispatch` defaults it empty, and a
      # checkbox is one mis-click; a phrase somebody has to type is a decision.
      confirm_seed_production:
        description: 'To seed PRODUCTION, type: seed production demo data'
        type: string
        default: ''

concurrency:
  # One deploy at a time per environment; a newer push supersedes an older one.
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TARGET_ENV: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v5

      # Fail early and legibly. Without this, a missing secret surfaces as an
      # opaque wrangler auth error three minutes into the run.
      - name: Check the Cloudflare token is present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set."
            echo "Add it under Settings → Secrets and variables → Actions."
            echo "The token needs edit permissions for: Workers Scripts, D1, R2, KV, Queues."
            exit 1
          fi
          echo "Token present. Deploying to: $TARGET_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Print who the token actually is before spending four minutes on the
      # build. A token that authenticates can still be scoped to the wrong
      # account or be missing a single permission, and Cloudflare reports both
      # as an opaque 7403 from whichever API is hit first. This shows the
      # account and the granted scopes in the log, which turns "not authorized"
      # into a specific thing to go fix.
      - name: Show the authenticated Cloudflare account
        run: bunx wrangler whoami || echo "::warning::wrangler whoami failed — the token may be malformed."

      # Probe every API this deploy actually calls, and say which ones the token
      # is allowed to reach.
      #
      # Cloudflare returns the same error — 7403, "the given account is not
      # valid or is not authorized to access this service" — for a token scoped
      # to the wrong account and for a token missing one permission checkbox.
      # Read from a raw wrangler failure it is nearly undiagnosable, and each
      # guess costs a full CI round trip. This names the missing permission.
      #
      # Workers Scripts and D1 are hard requirements: without them there is
      # nothing to deploy, or nowhere to migrate. R2, KV, and Queues are
      # reported but not enforced, because their bindings resolve by ID at
      # deploy time and the token does not need to read them for `deploy` to
      # succeed.
      - name: Check what the token is allowed to do
        env:
          PROD_DB_ID: ea56fb83-a754-45a3-b2a9-ae54914e43b3
        run: |
          API=https://api.cloudflare.com/client/v4
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          ACCOUNT_ID=$(curl -sS -H "$AUTH" "$API/accounts" | jq -r '.result[0].id // empty')
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::The token cannot list accounts — it is invalid, expired, or revoked."
            exit 1
          fi
          echo "Account: $ACCOUNT_ID"
          echo ""

          HARD_FAIL=0

          probe() {
            LABEL="$1"; REQUIRED="$2"; METHOD="$3"; URL="$4"; BODY="${5:-}"

            if [ -n "$BODY" ]; then
              OUT=$(curl -sS -X "$METHOD" -H "$AUTH" -H 'Content-Type: application/json' \
                    -d "$BODY" "$URL" 2>&1)
            else
              OUT=$(curl -sS -X "$METHOD" -H "$AUTH" "$URL" 2>&1)
            fi

            if [ "$(printf '%s' "$OUT" | jq -r '.success // false' 2>/dev/null)" = "true" ]; then
              echo "  ✓ $LABEL"
              return
            fi

            REASON=$(printf '%s' "$OUT" | jq -r '.errors[0].message // "unreadable response"' 2>/dev/null)
            if [ "$REQUIRED" = "required" ]; then
              echo "  ✗ $LABEL — $REASON"
              HARD_FAIL=1
            else
              echo "  ~ $LABEL — $REASON (not required to deploy)"
            fi
          }

          probe "Workers Scripts" required GET "$API/accounts/$ACCOUNT_ID/workers/scripts"
          # The query endpoint, not the list endpoint: migrations write, so a
          # read-only D1 token passes a list check and then fails the migration.
          probe "D1 (query)" required POST \
            "$API/accounts/$ACCOUNT_ID/d1/database/$PROD_DB_ID/query" '{"sql":"SELECT 1"}'
          probe "R2"     optional GET "$API/accounts/$ACCOUNT_ID/r2/buckets"
          probe "KV"     optional GET "$API/accounts/$ACCOUNT_ID/storage/kv/namespaces"
          probe "Queues" optional GET "$API/accounts/$ACCOUNT_ID/queues"

          # Deploys can also originate from Cloudflare Workers Builds, which
          # runs against this repo independently of Actions. Report what is
          # actually in the account so a surprise second Worker — or a build
          # that landed somewhere unexpected — is visible here rather than
          # discovered later by someone loading the wrong URL.
          echo ""
          echo "Workers in this account named auxilium*:"
          curl -sS -H "$AUTH" "$API/accounts/$ACCOUNT_ID/workers/scripts" 2>/dev/null \
            | jq -r '[.result[].id | select(startswith("auxilium"))] | if length == 0 then "  (none)" else .[] | "  " + . end' \
            2>/dev/null || echo "  (could not list)"

          SUBDOMAIN=$(curl -sS -H "$AUTH" "$API/accounts/$ACCOUNT_ID/workers/subdomain" 2>/dev/null \
            | jq -r '.result.subdomain // empty' 2>/dev/null || true)
          if [ -n "$SUBDOMAIN" ]; then
            echo "workers.dev subdomain: $SUBDOMAIN"
          fi

          echo ""
          if [ "$HARD_FAIL" = "1" ]; then
            echo "::error::The Cloudflare API token is missing a permission the deploy requires (see ✗ above)."
            echo "Edit the token at https://dash.cloudflare.com/profile/api-tokens and grant, on this account:"
            echo "  • Account → Workers Scripts → Edit"
            echo "  • Account → D1 → Edit"
            echo "  • Account → Workers R2 Storage → Edit"
            echo "  • Account → Workers KV Storage → Edit"
            echo "  • Account → Queues → Edit"
            echo "Then re-run this workflow. Nothing in the repository needs to change."
            exit 1
          fi
          echo "Token has everything the deploy requires."

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The gate. Nothing ships that does not typecheck, lint, and pass its
      # tests — the NRI rules and the import matcher are exactly the logic you
      # do not want to discover is broken in production.
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Migrations before deploy, always. New code against an old schema fails
      # on the first request; old code against a new schema is usually fine.
      # Wrangler records applied migrations, so this is a no-op when current.
      - name: Apply database migrations
        run: |
          if [ "$TARGET_ENV" = "production" ]; then
            bunx wrangler d1 migrations apply auxilium-db-prod --remote --env production
          else
            bunx wrangler d1 migrations apply auxilium-db-dev --remote
          fi

      # Queues must exist before a Worker that declares consumers can deploy,
      # and wrangler will not create them for you. This is idempotent: an
      # existing queue is left alone.
      #
      # Cloudflare Queues require a paid Workers plan. If creation fails, say so
      # plainly here rather than letting it surface as an opaque deploy error
      # further down. Auxilium runs without queues — imports commit inline and
      # signals recompute inline — but wrangler refuses to deploy while
      # wrangler.toml still declares consumers, so this needs a human decision.
      - name: Ensure queues exist
        run: |
          # Production has its own queues, matching its own D1/R2/KV. See the
          # comment above the production queue blocks in wrangler.toml for why
          # sharing them across environments was a data-integrity problem and
          # not just untidiness.
          if [ "$TARGET_ENV" = "production" ]; then
            QUEUES="auxilium-imports-prod auxilium-signals-prod auxilium-imports-prod-dlq auxilium-signals-prod-dlq"
          else
            QUEUES="auxilium-imports auxilium-signals auxilium-imports-dlq auxilium-signals-dlq"
          fi

          MISSING=0
          for q in $QUEUES; do
            if bunx wrangler queues info "$q" >/dev/null 2>&1; then
              echo "  $q — already exists"
            elif bunx wrangler queues create "$q" >/dev/null 2>&1; then
              echo "  $q — created"
            else
              echo "  $q — could not be created"
              MISSING=1
            fi
          done

          if [ "$MISSING" = "1" ]; then
            echo "::warning::One or more queues are missing. Cloudflare Queues require a paid Workers plan."
            echo "If the deploy step fails on a queue binding, either enable Queues on the account"
            echo "or remove the [[queues.*]] blocks from wrangler.toml — the app degrades to inline"
            echo "execution without them (see the degradation table in CLAUDE.md)."
          fi

      # Capture the URL wrangler prints so the verification below checks the
      # thing that was actually just deployed, rather than reconstructing a
      # hostname and hoping it matches.
      - name: Deploy
        run: |
          set -o pipefail
          # Stamp the build with the commit that produced it.
          #
          # Without this, `APP_VERSION` is unset and every error report and bug
          # report says "unknown" for the version — so a report from a ministry
          # that has not reloaded in a fortnight gets debugged against code they
          # are not running. Passed as a var rather than a secret because it is
          # a public commit sha, and it is on the deploy command rather than in
          # wrangler.toml because the value is only known here.
          bunx wrangler deploy --env "$TARGET_ENV" \
            --var APP_VERSION:"${GITHUB_SHA::7}" 2>&1 | tee /tmp/deploy.log

          DEPLOYED_URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          if [ -n "$DEPLOYED_URL" ]; then
            echo "DEPLOYED_URL=$DEPLOYED_URL" >> "$GITHUB_ENV"
            echo "Deployed to $DEPLOYED_URL"
          fi

      # Preview only, and guarded twice — the seed script itself targets the
      # dev database, and this step refuses to run outside preview regardless.
      # Two bugs lived here besides the refusal: the database name was
      # hardcoded to the dev one regardless of target, and only the first of
      # three seed files ran — so even the preview path produced a half-seeded
      # ministry with no integrity ledger and no member portal accounts.
      - name: Seed demo data
        if: ${{ github.event.inputs.seed_demo == 'true' }}
        run: |
          set -euo pipefail

          if [ "$TARGET_ENV" = "production" ]; then
            if [ "${{ github.event.inputs.confirm_seed_production }}" != "seed production demo data" ]; then
              echo "::error::Seeding production requires typing the confirmation phrase."
              exit 1
            fi
            DB=auxilium-db-prod
          else
            DB=auxilium-db-dev
          fi

          echo "Seeding $DB ($TARGET_ENV)."

          # Order matters. seed-reset clears both demo orgs leaf-first, so
          # this is re-runnable against a database that already has rows —
          # which every deployed one does. Then the ministry and its people,
          # the ledger and the failing ministry, and the portal accounts that
          # reference both.
          for f in seed-reset.sql seed.sql seed-integrity.sql seed-portal.sql; do
            echo "→ $f"
            bunx wrangler d1 execute "$DB" --remote --file="./schema/$f"
          done

      # Local green is not shipped. Fetch the real thing and confirm it answers.
      #
      # This step used to derive the hostname from `wrangler subdomain get`, and
      # exit 0 with a warning when that came back empty — which it always did,
      # so the check never ran while the job still reported success and the
      # summary below claimed the health endpoint had been verified. A
      # verification that passes without verifying is worse than no
      # verification: it is a green tick asserting something nobody checked.
      #
      # The URL now comes from the deploy step's own output, and its absence is
      # a failure rather than a shrug.
      - name: Verify the deploy is live
        run: |
          if [ -z "$DEPLOYED_URL" ]; then
            echo "::error::The deploy step printed no workers.dev URL, so the live check cannot run."
            echo "Refusing to report success for a deploy that was never verified."
            exit 1
          fi

          URL="$DEPLOYED_URL/api/health"
          echo "Checking $URL"

          # A fresh deploy can take a few seconds to propagate.
          for attempt in 1 2 3 4 5; do
            BODY=$(curl -fsS --max-time 20 "$URL" 2>/dev/null) && break
            echo "  attempt $attempt failed, retrying in 10s"
            sleep 10
          done

          echo "$BODY"

          echo "$BODY" | grep -q '"d1":"ok"' \
            || { echo "::error::D1 is not answering — check that migrations ran."; exit 1; }
          echo "$BODY" | grep -q "\"env\":\"$TARGET_ENV\"" \
            || { echo "::error::Deployed Worker reports the wrong environment."; exit 1; }

          echo "Live and healthy at $URL"

      - name: Summary
        if: always()
        run: |
          # Report what happened, not what was supposed to happen. This ran with
          # `if: always()` while stating flatly that migrations had been applied
          # and the health endpoint verified — including on runs where the job
          # failed before either step.
          {
            echo "### Auxilium deploy — \`$TARGET_ENV\`"
            echo ""
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            if [ -n "$DEPLOYED_URL" ]; then
              echo "- Deployed to $DEPLOYED_URL"
            else
              echo "- **Not deployed** — the run did not reach a successful deploy"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
